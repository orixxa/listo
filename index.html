<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Listo - Live Shared List</title>

<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

<style>
:root {
  --bg1: #f8fafc; --bg2: #edf2f7; --bg3: #e2e8f0; --bg4: #e0f2fe;
  --card: #ffffff; --text: #1e293b; --itemBg: #f1f5f9;
  --doneBg: #dcfce7; --doneBorder: #bbf7d0; --doneText: #16a34a;
  --naBg: #fee2e2; --naBorder: #fecaca; --naText: #dc2626;
  --inputBg: #ffffff; --inputBorder: #cbd5e1;
  --primary: #6366F1;
}

html.dark, body.dark {
  --bg1: #0f172a; --bg2: #1e293b; --bg3: #0f172a; --bg4: #334155;
  --card: #1e293b; --text: #f8fafc; --itemBg: #0f172a;
  --doneBg: #064e3b; --doneBorder: #047857; --doneText: #4ade80;
  --naBg: #7f1d1d; --naBorder: #991b1b; --naText: #f87171;
  --inputBg: #1e293b; --inputBorder: #475569;
}

html { background-color: var(--bg1); transition: background-color 0.3s ease; }
body::before {
  content: ""; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(-45deg, var(--bg1), var(--bg2), var(--bg3), var(--bg4));
  background-size: 400% 400%; animation: bg 8s ease-in-out infinite; z-index: -1;
}
body { margin: 0; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 10px; box-sizing: border-box; min-height: 100vh; width: 100%; }

.logo { width: 80px; height: auto; margin: 10px 0; }
.container { max-width: 500px; width: 100%; }
.card { background: var(--card); color: var(--text); padding: 15px 20px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; box-sizing: border-box; }

.header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
.stat-lbl { font-size: 10px; font-weight: 800; color: #16a34a; text-transform: uppercase; }
.stat-val { font-size: 14px; font-weight: 900; }

.sync-status { font-size: 10px; font-weight: bold; padding: 3px 8px; border-radius: 10px; display: flex; align-items: center; gap: 5px; }
.status-online { background: #dcfce7; color: #16a34a; }
.status-offline { background: #fee2e2; color: #ef4444; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.cat-badge { text-align: center; font-size: 12px; font-weight: 700; color: var(--primary); background: #eef2ff; padding: 5px 15px; border-radius: 12px; margin-bottom: 15px; width: fit-content; margin: 0 auto; }
body.dark .cat-badge { background: #312e81; color: #a5b4fc; }

.item-card { background: var(--itemBg); padding: 15px; border-radius: 16px; margin-bottom: 12px; border: 1px solid var(--bg3); }
.item-card.done { background: var(--doneBg); border-color: var(--doneBorder); }
.item-card.na { background: var(--naBg); border-color: var(--naBorder); }

.item-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.item-info { flex: 1; display: flex; flex-direction: column; }
.item-name { font-size: 16px; font-weight: 700; }
.item-qty { font-size: 12px; color: var(--primary); font-weight: bold; }

.price-input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--inputBorder); background: var(--inputBg); color: var(--text); outline: none; margin-bottom: 10px; }
.btn-group { display: flex; gap: 10px; }
.btn { flex: 1; padding: 12px; border: none; border-radius: 10px; color: white; font-weight: 800; cursor: pointer; }
.btn-avail { background: #22c55e; }
.btn-na { background: #ef4444; }
</style>
</head>
<body>

<img src="https://image2url.com/r2/default/images/1774860458918-c6f7a05c-ca26-46e6-96fc-a7648f576bb0.png" class="logo">

<div class="container">
  <div class="card">
    <div class="header-top">
        <div style="display:flex; gap:10px;">
            <div><span class="stat-lbl">Items</span><div id="count" class="stat-val">0</div></div>
            <div><span class="stat-lbl">Total</span><div id="total" class="stat-val">₹0</div></div>
        </div>
        <div id="syncIndicator" class="sync-status status-offline">
            <div class="dot"></div> <span id="syncText">Connecting...</span>
        </div>
    </div>

    <div id="catDisplay" class="cat-badge">Loading...</div>
    <div id="list">
        <div style="text-align:center; color:gray; padding:20px;">Setting up your list...</div>
    </div>
  </div>
</div>

<script>
// 1. Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyBbBsz8FgD6_5WKbCvfqtEkPLa9q_PIhuA",
  authDomain: "listo-356ba.firebaseapp.com",
  projectId: "listo-356ba",
  storageBucket: "listo-356ba.firebasestorage.app",
  messagingSenderId: "104729909475",
  appId: "1:104729909475:web:fb3bd44800d371b7748dd6"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// 2. State & Params
const params = new URLSearchParams(location.search);
const uid = params.get("uid");
const ocn = params.get("ocn") || "";
const itemsParam = params.get("items");
let globalItems = [];
let syncTimeout;

const emojiMap = { "apple":"🍎","milk":"🥛","egg":"🥚","bread":"🍞","water":"💧","onion":"🧅","potato":"🥔","tomato":"🍅","oil":"🧴","sugar":"🍬","salt":"🧂","chicken":"🍗","meat":"🥩","fish":"🐟","soap":"🧼","shampoo":"🧴","medicine":"💊","pen":"🖊️" };
function getEmoji(name) {
    const n = name.toLowerCase();
    for (let k in emojiMap) if (n.includes(k)) return emojiMap[k];
    return "🛒";
}

// 3. 🚀 Fast Load from URL (Firebase के इंतज़ार के बिना)
if (itemsParam) {
    globalItems = itemsParam.split(';').map(it => {
        const parts = it.split('|');
        return { name: decodeURIComponent(parts[0]), q: decodeURIComponent(parts[1] || ""), price: "", status: "pending" };
    });
    document.getElementById("catDisplay").innerText = ocn || "Shared List";
    renderUI();
}

// 4. 🔥 Firebase Live Listener
if (uid) {
    db.collection("users").doc(uid).onSnapshot(doc => {
        if (doc.exists) {
            document.getElementById("syncIndicator").className = "sync-status status-online";
            document.getElementById("syncText").innerText = "Live Sync";
            
            const data = doc.data();
            let newItems = [];
            
            if (ocn === "" || ocn === "Show Item") {
                newItems = data.items || [];
                document.getElementById("catDisplay").innerText = "Main List";
            } else if (data.categories && data.categories[ocn]) {
                newItems = data.categories[ocn].items || [];
                document.getElementById("catDisplay").innerText = ocn;
            }
            
            if (newItems.length > 0) {
                globalItems = newItems;
                renderUI();
            }
        }
    }, err => {
        document.getElementById("syncText").innerText = "Cloud Error";
        console.error("Firebase Error:", err);
    });
}

function renderUI() {
    const listDiv = document.getElementById("list");
    listDiv.innerHTML = "";
    let total = 0;
    
    document.getElementById("count").innerText = globalItems.length;

    globalItems.forEach((it, i) => {
        if (it.status === "done") total += Number(it.price || 0);
        const card = document.createElement("div");
        card.className = `item-card ${it.status}`;
        card.innerHTML = `
            <div class="item-row">
                <span class="item-emoji">${getEmoji(it.name)}</span>
                <div class="item-info">
                    <span class="item-name">${it.name}</span>
                    <span class="item-qty">${it.q || ''}</span>
                </div>
                ${it.status !== 'pending' ? `<span class="stat-lbl">${it.status==='done'?'Available':'N/A'}</span>` : ''}
            </div>
            <input type="number" class="price-input" value="${it.price || ''}" placeholder="Price ₹" oninput="updateLocal(${i}, 'price', this.value)">
            ${it.status === 'pending' ? `
                <div class="btn-group">
                    <button class="btn btn-avail" onclick="updateLocal(${i}, 'status', 'done')">Available</button>
                    <button class="btn btn-na" onclick="updateLocal(${i}, 'status', 'na')">N/A</button>
                </div>
            ` : ''}
        `;
        listDiv.appendChild(card);
    });
    document.getElementById("total").innerText = "₹" + total;
}

window.updateLocal = function(idx, field, val) {
    globalItems[idx][field] = val;
    if (field === 'status') renderUI();
    
    let t = 0; globalItems.forEach(it => { if(it.status==='done') t += Number(it.price||0); });
    document.getElementById("total").innerText = "₹" + t;

    clearTimeout(syncTimeout);
    syncTimeout = setTimeout(() => {
        if (!uid) return;
        const ref = db.collection("users").doc(uid);
        if (ocn === "" || ocn === "Show Item") ref.update({ items: globalItems });
        else ref.update({ [`categories.${ocn}.items`]: globalItems });
    }, 1000);
};
</script>
</body>
</html>
